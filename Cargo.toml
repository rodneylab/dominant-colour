[package]
name = "dominant-colour"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/rodneylab/dominant-colour"
rust-version = "1.85.0"
description = "Generate dominant colour, base64 data-URIs for use as website image placeholders"

[[bin]]
path = "src/main.rs"
name = "dominant-colour"

[features]
internal-tools = ["clap-markdown"]

[dependencies]
arboard = "3.6.1"
askama = "0.16.1"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
clap-markdown = { version = "0.1.5", optional = true }
clap-verbosity-flag = "3.0.4"
env_logger = "0.11.11"
humansize = "2.1.3"
image = { version = "0.25.10", default-features = false, features = ["avif", "avif-native", "gif", "jpeg", "png", "rayon", "webp"] }
kmeans_colors = { version = "0.7.1", default-features = false, features = ["palette_color"] }
log = "0.4.33"
miette = { version = "7.6.0", features = ["fancy"] }
mozjpeg-rs = "0.9.2"
oxipng = "10.2.1"
palette = "0.7.7"
ravif = { version = "0.13.0" }
thiserror = "2.0.20"

[dev-dependencies]
assert_fs = "1.1.4"
insta = { version = "1.48.0", features = ["json"] }
proptest = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
trycmd = "1.2.1"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[lints.rust]
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
dbg_macro = "deny"
print_stdout = "deny"
clone_on_ref_ptr = "deny"
empty_drop = "deny"
exit = "deny"
filetype_is_file = "deny"
get_unwrap = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
unnecessary_safety_comment = "deny"
debug_assert_with_mut_call = "warn"
iter_on_single_items = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
significant_drop_in_scrutinee = "warn"
unused_peekable = "warn"
